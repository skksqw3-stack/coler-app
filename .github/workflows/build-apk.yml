name: Build Kotlin APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.5

      - name: Show repo structure
        run: |
          echo "===== ROOT ====="
          ls -la
          echo ""
          echo "===== app/ ====="
          ls -la app/ || echo "no app/ folder"
          echo ""
          echo "===== app/build.gradle exists? ====="
          test -f app/build.gradle && echo "YES" || echo "NO"
          echo ""
          echo "===== settings.gradle ====="
          cat settings.gradle || echo "no settings.gradle"

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.5

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK (debug)
        run: ./gradlew assembleDebug --stacktrace --no-daemon
        continue-on-error: true

      - name: Show build output
        if: always()
        run: |
          echo "===== APK FILES ====="
          find app/build/outputs -name "*.apk" 2>/dev/null || echo "no APK found"
          echo ""
          echo "===== debug dir ====="
          ls -la app/build/outputs/apk/debug/ 2>/dev/null || echo "no debug dir"

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coolercontrol-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
